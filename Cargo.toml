[package]
name = "prov"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
description = "Provenance for research artifacts and experiment runs: content manifests, duplicate detection, run records, reruns and lineage"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["provenance", "reproducibility", "sha256", "manifest", "research"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
globset = "0.4.21"
jiff = "0.2.39"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
walkdir = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
